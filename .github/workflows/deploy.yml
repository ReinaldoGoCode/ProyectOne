name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    name: Verificar y construir
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos, lint y pruebas
        run: pnpm check

      - name: Verificar migraciones y RLS
        run: pnpm test:db

      - name: Verificar formato
        run: pnpm format:check

      - name: Construir el sitio
        run: pnpm build
        env:
          VITE_BASE_PATH: /ProyectOne/
          # La clave publishable es pública y se usa solo desde el navegador.
          # Las claves secretas del backend nunca entran en este build.
          VITE_SUPABASE_URL: https://ctnpisuizfhxcuxrjhah.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AJYvJHSmKJ8_RYymY1IR1Q_-_UJh1d2
          VITE_STORE_WHATSAPP_NUMBER: ''

      - name: Copiar index.html como 404 para las rutas del cliente
        run: cp dist/index.html dist/404.html

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
