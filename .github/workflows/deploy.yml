name: Verificar Norte Moda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar y construir para Netlify
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos, lint y pruebas
        run: pnpm check

      - name: Verificar migraciones y RLS
        run: pnpm test:db

      - name: Verificar formato
        run: pnpm format:check

      - name: Construir el sitio
        run: pnpm build
        env:
          VITE_BASE_PATH: /
          # La clave publishable es pública y se usa solo desde el navegador.
          # Las claves secretas del backend nunca entran en este build.
          VITE_SUPABASE_URL: https://ctnpisuizfhxcuxrjhah.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_AJYvJHSmKJ8_RYymY1IR1Q_-_UJh1d2
          VITE_STORE_WHATSAPP_NUMBER: '584142351183'
